<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Your Biomexa report</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #13213d; }
  .box { background: #fff; border: 1px solid #dfe5ef; border-radius: 16px; padding: 28px 24px; max-width: 380px; width: calc(100% - 32px); text-align: center; box-shadow: 0 10px 30px rgba(19,33,61,.08); }
  img { height: 40px; margin-bottom: 14px; }
  h1 { font-size: 1.15rem; margin: 0 0 6px; }
  p { color: #5b6b86; font-size: .92rem; margin: 0 0 18px; line-height: 1.5; }
  a.btn { display: inline-block; background: #16336b; color: #fff; text-decoration: none; font-weight: 700; padding: 12px 20px; border-radius: 10px; }
  .spin { width: 26px; height: 26px; border: 3px solid #dfe5ef; border-top-color: #1c9a55; border-radius: 50%; margin: 0 auto 14px; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="box">
  <img src="images/logo-full.png" alt="Biomexa Pharmaceuticals">
  <div class="spin" id="spin"></div>
  <h1 id="h">Opening your report…</h1>
  <p id="p">Your Biomexa course report (PDF) is loading.</p>
  <a class="btn" id="open" href="index.html" hidden>Open my report</a>
</div>
<script>
// Biomexa report links point here, on the Biomexa domain, and open the PDF from the Biomexa server.
(function () {
  var API = 'https://biomexa-api-f9f6.onrender.com';
  var q = new URLSearchParams(location.search);
  var c = (q.get('c') || '').split('.');
  var url = null;
  if (c.length === 3 && /^[a-f0-9]{24}$/.test(c[0]) && /^[a-f0-9]{24}$/.test(c[1]) && /^[a-f0-9]{24}$/.test(c[2])) {
    url = API + '/api/course-report/' + c[0] + '/' + c[1] + '/' + c[2] + '/Biomexa-course-report.pdf';
  }
  var btn = document.getElementById('open');
  if (!url) {
    document.getElementById('spin').hidden = true;
    document.getElementById('h').textContent = 'This report link is not valid';
    document.getElementById('p').textContent = 'Please use the link from your WhatsApp message, or reply HELP on WhatsApp.';
    btn.textContent = 'Go to Biomexa'; btn.hidden = false;
    return;
  }
  // Android (incl. WhatsApp's in-app browser) can't hand a page-made file to another app — the
  // "Continue" in "You're leaving WhatsApp" then does nothing. There, the button opens the real PDF
  // address, which Android passes to its PDF viewer / Downloads normally.
  if (/Android/i.test(navigator.userAgent)) {
    document.getElementById('spin').hidden = true;
    document.getElementById('h').textContent = 'Your report is ready';
    document.getElementById('p').textContent = 'Tap below to open or save your Biomexa course report (PDF). If WhatsApp asks, tap Continue. Please show it to your doctor at your next visit.';
    btn.href = url; btn.target = '_blank'; btn.rel = 'noopener'; btn.textContent = 'Open my report'; btn.hidden = false;
    return;
  }
  // Elsewhere: load the PDF here so the address stays on biomexapharmaceuticals.com, then open it.
  btn.href = url;
  fetch(url).then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); }).then(function (b) {
    var blobUrl = URL.createObjectURL(new Blob([b], { type: 'application/pdf' }));
    document.getElementById('spin').hidden = true;
    document.getElementById('h').textContent = 'Your report is ready';
    document.getElementById('p').textContent = 'Tap below to open or save your Biomexa course report (PDF). Please show it to your doctor at your next visit.';
    btn.href = blobUrl; btn.download = 'Biomexa-course-report.pdf'; btn.textContent = 'Open my report'; btn.hidden = false;
    // Desktop browsers show the PDF straight away; phones open it from the button.
    if (!/Android|iPhone|iPad/i.test(navigator.userAgent)) location.href = blobUrl;
  }).catch(function () { location.replace(url); });
})();
</script>
</body>
</html>
